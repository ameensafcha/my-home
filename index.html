<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghar 3D Model</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe6ec; font-family: system-ui, sans-serif; }
  #panel { position: fixed; right: 12px; top: 12px; width: 250px; max-width: calc(100vw - 24px); box-sizing: border-box;
           background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px); color: #1f2933;
           border-radius: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); font-size: 14px; }
  #panel summary { list-style: none; cursor: pointer; user-select: none; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel > summary { padding: 10px 14px; font-weight: 600; display: flex; justify-content: space-between; }
  #panel > summary::after { content: '\25BE'; transition: transform 0.2s; }
  #panel:not([open]) > summary::after { transform: rotate(-90deg); }
  #panel .body { padding: 0 10px 10px; max-height: calc(100vh - 70px); overflow-y: auto; }
  .group { background: #f3f5f7; border-radius: 9px; margin-top: 8px; }
  .group > summary { padding: 8px 10px; font-weight: 600; font-size: 13px; color: #52606d; display: flex; justify-content: space-between; }
  .group > summary::after { content: '+'; font-weight: 400; }
  .group[open] > summary::after { content: '\2212'; }
  .group .rows { padding: 0 10px 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  .row input { accent-color: #3b7c86; width: 16px; height: 16px; margin: 0; }
  .field { display: block; margin: 4px 0 8px; font-size: 12px; color: #52606d; }
  .field select { display: block; width: 100%; margin-top: 4px; padding: 6px 8px; font-size: 13px;
                  border: 1px solid #cbd2d9; border-radius: 7px; background: #fff; color: #1f2933; }
  .sizes h4 { margin: 8px 0 4px; font-size: 12px; color: #3b7c86; }
  .sizes table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sizes td { padding: 3px 0; border-bottom: 1px solid #e4e7eb; }
  .sizes td:last-child { text-align: right; white-space: nowrap; color: #52606d; }
  #panel .hint { margin: 10px 2px 0; font-size: 12px; color: #7b8794; line-height: 1.4; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<details id="panel">
  <summary>Options</summary>
  <div class="body">
    <details class="group">
      <summary>Ground floor</summary>
      <div class="rows">
        <label class="row"><input type="checkbox" id="outer" checked autocomplete="off"> Outer walls</label>
        <label class="row"><input type="checkbox" id="groundNames" autocomplete="off"> Room names</label>
      </div>
    </details>
    <details class="group" open>
      <summary>First floor</summary>
      <div class="rows">
        <label class="field">Layout
          <select id="floor" autocomplete="off">
            <option value="d1">Design 1 (original)</option>
            <option value="d4" selected>Design 4 (open hall)</option>
            <option value="hide">Hide first floor</option>
          </select>
        </label>
        <label class="row"><input type="checkbox" id="upOuter" checked autocomplete="off"> Outer walls</label>
        <label class="row"><input type="checkbox" id="upperNames" autocomplete="off"> Room names</label>
      </div>
    </details>
    <details class="group">
      <summary>Room sizes</summary>
      <div class="rows sizes" id="sizes"></div>
    </details>
    <p class="hint">Drag to rotate · Scroll or pinch to zoom · Right-drag to move</p>
  </div>
</details>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Units = feet. x: left→right, z: back (House of Other) → front (Road). Origin = back-left outer corner.
const H = 10, DOOR = 7;              // wall height, door-top height
const W = 21.42, D = 32.75, T = 0.75; // plot 21'5" x 32'9", outer wall 9"

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe9f2, 90, 220);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(W / 2 + 28, 42, D + 30);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(W / 2, 0, D / 2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 4;
controls.maxDistance = 85;                            // zoom-out limit: whole house stays in view

// Soft daylight: sky/ground fill + a room-style environment for reflections + one sun for shadows
scene.add(new THREE.HemisphereLight(0xeaf3ff, 0x8a8170, 0.9));
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(-20, 50, 60);
sun.target.position.set(W / 2, 0, D / 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// Procedural textures (no image files needed): floor tiles, wood, granite, plaster, fabric, grass, road
function canvasTex(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function speckle(g, s, n, colors, size = 2) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = colors[i % colors.length];
    g.fillRect(Math.random() * s, Math.random() * s, size, size);
  }
}
const tileTex = canvasTex(256, (g, s) => {                         // one tile: soft marble veins + grout line
  g.fillStyle = '#f5f3ef'; g.fillRect(0, 0, s, s);
  speckle(g, s, 1500, ['rgba(0,0,0,0.035)', 'rgba(255,255,255,0.6)'], 3);
  g.strokeStyle = 'rgba(110,105,100,0.22)'; g.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) {
    g.beginPath(); g.moveTo(Math.random() * s, 0);
    g.bezierCurveTo(Math.random() * s, s / 3, Math.random() * s, 2 * s / 3, Math.random() * s, s); g.stroke();
  }
  g.strokeStyle = 'rgba(70,65,60,0.5)'; g.lineWidth = 5; g.strokeRect(0, 0, s, s);
});
const woodTex = canvasTex(256, (g, s) => {                         // light wood with grain lines (tinted per use)
  g.fillStyle = '#c99a66'; g.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 3) {
    g.fillStyle = `rgba(${70 + Math.random() * 40},${40 + Math.random() * 20},18,${0.12 + Math.random() * 0.3})`;
    g.fillRect(0, y + Math.sin(y) * 1.5, s, 1 + Math.random() * 2);
  }
});
const graniteTex = canvasTex(256, (g, s) => { g.fillStyle = '#d6d6d6'; g.fillRect(0, 0, s, s); speckle(g, s, 5000, ['#8a8a8a', '#ffffff', '#5a5a5a', '#bdbdbd'], 2); });
const plankTex = canvasTex(256, (g, s) => {                        // 2' x 2' of oak floor planks (4 per tile, staggered)
  const w = s / 4;
  for (let i = 0; i < 4; i++) {
    g.fillStyle = ['#caa27a', '#c39a70', '#d0a982', '#bf9468'][i]; g.fillRect(i * w, 0, w, s);
    for (let y = 0; y < s; y += 3) { g.fillStyle = `rgba(90,60,30,${Math.random() * 0.12})`; g.fillRect(i * w, y, w, 1); }
    g.fillStyle = 'rgba(60,40,20,0.45)'; g.fillRect(i * w, 0, 2, s);
    const cut = (i % 2 ? 0.3 : 0.75) * s; g.fillRect(i * w, cut, w, 2);
  }
});
const plasterTex = canvasTex(256, (g, s) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s); speckle(g, s, 4000, ['rgba(0,0,0,0.045)', 'rgba(0,0,0,0.025)'], 2); });
const fabricTex = canvasTex(128, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < s; i += 2) { g.fillStyle = 'rgba(0,0,0,0.05)'; g.fillRect(i, 0, 1, s); g.fillRect(0, i, s, 1); }
});
const grassTex = canvasTex(256, (g, s) => { g.fillStyle = '#7d9a5b'; g.fillRect(0, 0, s, s); speckle(g, s, 9000, ['#6b884c', '#93ad6d', '#5d7843', '#a4b97d'], 2); });
const roadTex = canvasTex(256, (g, s) => { g.fillStyle = '#4a4d51'; g.fillRect(0, 0, s, s); speckle(g, s, 9000, ['#3d4044', '#5b5e62', '#34373a', '#6a6d71'], 2); });
scene.background = canvasTex(512, (g, s) => {                       // sky
  const gr = g.createLinearGradient(0, 0, 0, s);
  gr.addColorStop(0, '#7fb2e0'); gr.addColorStop(0.6, '#cfe2f2'); gr.addColorStop(1, '#eef4f8');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
function texMat(tex, color, repX, repZ, roughness = 0.8) {          // own copy of the texture so the tiling fits the box
  const t = tex.clone();
  t.needsUpdate = true;
  t.repeat.set(repX, repZ);
  return new THREE.MeshStandardMaterial({ color, map: t, roughness });
}

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 });
const plaster = c => new THREE.MeshStandardMaterial({ color: c, map: plasterTex, roughness: 0.95 });
const wallMat = plaster(0xfaf7f0), upWallMat = plaster(0xece3d6);            // warm white downstairs, soft greige upstairs
const stairMat = new THREE.MeshStandardMaterial({ color: 0xc27a55, map: graniteTex, roughness: 0.5 });
function box(x0, z0, x1, z1, y0, y1, m) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), m);
  b.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  b.castShadow = b.receiveShadow = true;
  scene.add(b);
  return b;
}
// Floor with square tiles (`tile` feet each), tinted `color`
const tiled = (x0, z0, x1, z1, y0, y1, color, tile = 2) =>
  box(x0, z0, x1, z1, y0, y1, texMat(tileTex, color, (x1 - x0) / tile, (z1 - z0) / tile, 0.35));
const wall = (x0, z0, x1, z1) => box(x0, z0, x1, z1, 0, H, wallMat);
const lintel = (x0, z0, x1, z1) => box(x0, z0, x1, z1, DOOR, H, wallMat); // wall above a door gap

// Ground, road, floors
box(-15, -12, W + 15, D + 16, -0.6, -0.3, texMat(grassTex, 0xffffff, 16, 16, 1));
box(-15, D + 3, W + 15, D + 12, -0.55, -0.28, texMat(roadTex, 0xffffff, 10, 2, 0.9)); // Road 9'-0" wide
box(0, 0, W, D, -0.3, 0, plaster(0xb5aa98));                       // plinth
tiled(T, 11.25, W - T, 20.5, 0, 0.02, 0xd9c38a);                   // lobby
tiled(T, 20.5, 7, D - T, 0, 0.02, 0xd9c38a);                       // lobby front passage
tiled(T, T, 10.5, 10.75, 0, 0.02, 0x8fb8d8);                       // back room, left
tiled(11, T, W - T, 10.75, 0, 0.02, 0xe3a6b4);                     // back room, right
tiled(7.5, 21, W - T, D - T, 0, 0.02, 0x9ccc9c);                   // room (front)

// Outer walls (hidden by the "Neeche bahar ki deewar" checkbox)
const outer = [
  wall(0, 0, W, T),
  wall(0, 0, T, D),
  wall(W - T, 0, W, D),
  box(6.5, D - T, 8.1, D, 0, DOOR, wallMat), box(7, D - T, 8.1, D, DOOR, H, wallMat), // pillar gate | room door
  wall(11, D - T, W - T, D),                                       // stair side of the front wall: see washroom
  lintel(8.1, D - T, 11, D),                                       // front room door (gate: see balcony)
];

// Inner walls
// Two rooms side by side against the back wall, doors onto the lobby
wall(10.5, T, 11, 10.75);                                                          // left room | right room
wall(T, 10.75, 6, 11.25); wall(9, 10.75, 14, 11.25); wall(17, 10.75, W - T, 11.25); // rooms | lobby
lintel(6, 10.75, 9, 11.25); lintel(14, 10.75, 17, 11.25);                          // room doors
wall(7, 20.5, W - T, 21);                                                            // room | room
wall(7, 21, 7.5, 21.8); wall(7, 24.8, 7.5, D - T); lintel(7, 21.8, 7.5, 24.8);      // passage | front room

// U-stair: flight 1 along the left wall starts level with the road-side room's back wall (z=21)
// and rises toward the road. The landing slab runs forward to the front wall and sits on top of
// the gate opening; flight 2 turns back along the right wall (x=7) up to the next floor.
const SLAB = 0.5, MID = 3.9, LAND = DOOR + SLAB, START = 21, LAND_Z = 28;
const N1 = 10, N2 = 4, run = (LAND_Z - START) / N1, rise1 = LAND / N1, rise2 = (H - LAND) / N2;
const TOP_Z = LAND_Z - N2 * run;                                                       // where flight 2 reaches the floor
const WR_Z = START + 5 * run;                                                          // washroom back wall, under step 6
for (let i = 0; i < N1; i++) {
  const z0 = START + i * run, top = (i + 1) * rise1;
  box(T, z0, MID, z0 + run, z0 >= WR_Z ? top - SLAB : 0, top, stairMat);            // steps over the washroom are a slab
}
box(T, LAND_Z, 7, D - T, DOOR, LAND, stairMat);                                       // landing over the gate
for (let i = 0; i < N2; i++) {
  const top = LAND + (i + 1) * rise2;
  box(MID, LAND_Z - (i + 1) * run, 7, LAND_Z - i * run, top - SLAB, top, stairMat);
}

// Washroom entirely inside the space under flight 1 and the landing (x T..MID, z WR_Z..front wall);
// its walls stop at the underside of the steps and never stick out. The gate is the gap beside it.
const SW = MID - 0.4;
box(T, WR_Z, MID, WR_Z + 0.4, 0, 6 * rise1 - SLAB, wallMat);                         // back wall, up to the step above
for (let i = 5; i < N1; i++) {                                                         // side wall, stepped under the stairs
  const z0 = Math.max(START + i * run, WR_Z + 0.4);
  box(SW, z0, MID, START + (i + 1) * run, 0, (i + 1) * rise1 - SLAB, wallMat);
}
box(SW, LAND_Z, MID, 28.5, 0, DOOR, wallMat); box(SW, 30.5, MID, D - T, 0, DOOR, wallMat); // side wall under the landing
box(SW, 28.5, MID, 30.5, DOOR - 0.5, DOOR, wallMat);                                  // over the washroom door
outer.push(box(T, D - T, MID, D, 0, DOOR, wallMat));                                  // front wall; gate = MID..6.5
tiled(T, WR_Z + 0.4, SW, D - T, 0, 0.04, 0x6fb7c9, 1);                              // 1' tiles

// First-floor slab (lenter), with an opening over the stairwell:
// over the landing + both flights from TOP_Z (where flight 2 ends) to the front wall.
// Everything in `upper` is hidden by the "Upar ki manzil" checkbox so the ground floor can be seen.
const slabMat = plaster(0x9a9fa6), upper = [];
// While `design` points at d1..d4, everything added also belongs to that first-floor design.
const d1 = [], d4 = [];
let design = null;
const add = (...objs) => { upper.push(...objs); if (design) design.push(...objs); return objs[0]; };
const up = (...a) => add(box(...a));
const upOuter = [];                                               // upper-floor walls all around (own checkbox)
up(0, 0, W, 18, H, H + SLAB, slabMat);
up(T, 18, W, TOP_Z, H, H + SLAB, slabMat);
up(7, TOP_Z, W, D, H, H + SLAB, slabMat);
up(0, 18, T, D, H, H + SLAB, slabMat);

// Front projection 3'-0": under the upper room it is at first-floor level (room floor);
// over the gate it is a balcony at the stair landing level, reached from the landing through the wall.
const BR = 7.5;                                                    // balcony stops at the road-side room's wall (x 7..7.5)
up(BR, D, W, D + 3, H, H + SLAB, slabMat);                        // first lenter over the projection, under the upper room only (open above the balcony)
box(T, D - T, 7, D, DOOR, LAND, stairMat);                        // landing runs through the wall over the gate
box(0, D, BR, D + 3, DOOR, LAND, stairMat);                       // balcony over the gate, same as the landing
// Balcony walls: front and left as thick as the outer walls (T); the right one continues the
// road-side room's stair-side wall (x 7..7.5) so the two meet flush
const BF = D + 3 - T;
box(0, BF, BR, D + 3, LAND, H, wallMat);                          // front, level with the house walls
box(0, D, T, BF, LAND, H, wallMat);                               // left
box(7, D, BR, BF, LAND, H, wallMat);                              // right
upOuter.push(up(0, BF, BR, D + 3, H, 2 * H + SLAB, upWallMat));                  // same walls on the upper floor, up to room top
upOuter.push(up(0, D, T, BF, H, 2 * H + SLAB, upWallMat));

// Brown frame around every door/gate opening (two side posts + top), sticking out slightly from the wall
const doorMat = new THREE.MeshStandardMaterial({ color: 0x6e4a33, map: woodTex, roughness: 0.45 }), FW = 0.25, P = 0.06;
function door(x0, z0, x1, z1, y0 = 0, h = DOOR) {
  const alongX = x1 - x0 > z1 - z0;
  const part = (a0, a1, y1, y2) => alongX
    ? box(a0, z0 - P, a1, z1 + P, y1, y2, doorMat)
    : box(x0 - P, a0, x1 + P, a1, y1, y2, doorMat);
  const [a0, a1] = alongX ? [x0, x1] : [z0, z1];
  return [part(a0, a0 + FW, y0, y0 + h), part(a1 - FW, a1, y0, y0 + h), part(a0, a1, y0 + h - FW, y0 + h)];
}
// Window: light-blue glass in the wall with a brown frame all round (sill/top in feet above the floor)
const glassMat = new THREE.MeshStandardMaterial({ color: 0x9fd3f0, transparent: true, opacity: 0.6 });
function win(x0, z0, x1, z1, sill, top) {
  const alongX = x1 - x0 > z1 - z0, g = P / 2;
  const slab = (y1, y2, m, e) => alongX ? box(x0, z0 - e, x1, z1 + e, y1, y2, m) : box(x0 - e, z0, x1 + e, z1, y1, y2, m);
  return [slab(F + sill, F + top, glassMat, g), slab(F + sill, F + sill + FW, doorMat, P), ...door(x0, z0, x1, z1, F + sill, top - sill)];
}

// First-floor shell shared by all designs: the road-side room above the front room. Its front wall
// stands on the projection edge, so the projection is inside it. Its back and left walls are per design
// (design 1: door on the left facing the stair top; design 4: open to the hall).
const F = H + SLAB, FD = D + 3;
const fw = (x0, z0, x1, z1, y0 = F, y1 = F + H) => up(x0, z0, x1, z1, y0, y1, upWallMat);
const floor = (x0, z0, x1, z1, c, t = 0.04, tile = 2) => add(tiled(x0, z0, x1, z1, F, F + t, c, tile));
const planks = (x0, z0, x1, z1, t = 0.04) =>                         // wooden floor for bedrooms
  up(x0, z0, x1, z1, F, F + t, texMat(plankTex, 0xffffff, (x1 - x0) / 2, (z1 - z0) / 2, 0.5));
upOuter.push(fw(0, 0, W, T), fw(0, T, T, D), fw(W - T, T, W, 20.5)); // first-floor outer walls (front = balcony walls)
upOuter.push(fw(W - T, 21, W, FD));                                     // right
upOuter.push(fw(7, FD - T, W - T, FD));                                 // front
upOuter.push(...win(1.25, BF, 6.25, D + 3, LAND + 1.5 - F, 6));          // road-side window over the balcony (small lenter)
const shellDoorLeft = () => {                                           // design 1
  fw(7, 20.5, W, 21);                                                   // back
  fw(7, 21, 7.5, 21.2); fw(7, 24, 7.5, FD); fw(7, 21.2, 7.5, 24, F + DOOR); // left + door
  add(...door(7, 21.2, 7.5, 24, F));
};

// Furniture and fittings (feet): king bed 6'4" x 7', sofas 2'11" deep, WC 1'2" x 2'2", basin 1'8" x 1'4",
// washing machine 2' x 2', fridge 2'6" x 2'6", kitchen counters and wardrobes 2' deep
const wood = new THREE.MeshStandardMaterial({ color: 0x8a6a52, map: woodTex, roughness: 0.45 });   // walnut
const laminate = new THREE.MeshStandardMaterial({ color: 0xf1ece4, roughness: 0.35 }), joint = mat(0xa39a8e);
const fabric = c => new THREE.MeshStandardMaterial({ color: c, map: fabricTex, roughness: 0.95 });
const cloth = fabric(0xfbfaf7), pillow = fabric(0xffffff), blanket = fabric(0x5f7a8c), throwMat = fabric(0xc9824f);
const headMat = fabric(0xb9ad9d), accent = fabric(0xd9a441), rugMat = fabric(0xd6cab8);
const sofaMat = fabric(0x4f6d73), cushion = fabric(0x5f8087);
const white = new THREE.MeshStandardMaterial({ color: 0xf7f7f7, roughness: 0.15 });
const steel = new THREE.MeshStandardMaterial({ color: 0xc0c8d0, metalness: 0.8, roughness: 0.3 });
const tray = new THREE.MeshStandardMaterial({ color: 0xdde7ec, roughness: 0.3 });
const tvMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.2 });
const cabinet = mat(0x9fb49b), graniteTop = new THREE.MeshStandardMaterial({ color: 0x55595e, map: graniteTex, roughness: 0.25 });
const fridgeMat = new THREE.MeshStandardMaterial({ color: 0xdfe3e6, metalness: 0.3, roughness: 0.35 });
function bed(x0, z0, x1, z1, head) {                                                // headboard on the 'n' / 's' / 'e' / 'w' side
  up(x0, z0, x1, z1, F + 0.25, F + 1, wood);                                        // frame on a recessed base
  up(x0 + 0.3, z0 + 0.3, x1 - 0.3, z1 - 0.3, F, F + 0.25, joint);
  up(x0 + 0.1, z0 + 0.1, x1 - 0.1, z1 - 0.1, F + 1, F + 1.7, cloth);                // mattress
  // a = along the bed measured from the head end, b = across; mapped back to x / z
  const alongZ = head === 'n' || head === 's', flip = head === 's' || head === 'e';
  const [a0, a1, b0, b1] = alongZ ? [z0, z1, x0, x1] : [x0, x1, z0, z1];
  const put = (u0, u1, v0, v1, y0, y1, m) => {
    const [p, q] = flip ? [a1 - u1, a1 - u0] : [a0 + u0, a0 + u1];
    return alongZ ? up(v0, p, v1, q, y0, y1, m) : up(p, v0, q, v1, y0, y1, m);
  };
  const L = a1 - a0, mid = (b0 + b1) / 2;
  put(0, 0.35, b0 - 0.3, b1 + 0.3, F, F + 4.2, headMat);                            // padded headboard, wider than the bed
  put(0.35, 0.45, b0 + 0.2, b1 - 0.2, F + 2.2, F + 3.9, headMat);                   // raised centre panel
  put(0.5, 1.8, b0 + 0.4, mid - 0.2, F + 1.7, F + 2.3, pillow);
  put(0.5, 1.8, mid + 0.2, b1 - 0.4, F + 1.7, F + 2.3, pillow);
  put(1.9, 2.3, b0 + 1.2, mid - 0.3, F + 1.7, F + 2.4, accent);                     // two accent cushions
  put(1.9, 2.3, mid + 0.3, b1 - 1.2, F + 1.7, F + 2.4, accent);
  put(2.6, L, b0 - 0.05, b1 + 0.05, F + 1.25, F + 1.8, blanket);                    // duvet
  put(L - 1.7, L - 0.7, b0 - 0.08, b1 + 0.08, F + 1.8, F + 1.86, throwMat);         // throw across the foot
}
function sofa(x0, z0, x1, z1, back) {                                               // back against the 'n' / 's' / 'e' / 'w' wall
  const alongX = back === 'n' || back === 's';
  up(x0, z0, x1, z1, F, F + 1.05, sofaMat);                                         // base
  const b = { w: [x0, z0, x0 + 0.8, z1], e: [x1 - 0.8, z0, x1, z1], n: [x0, z0, x1, z0 + 0.8], s: [x0, z1 - 0.8, x1, z1] }[back];
  up(b[0], b[1], b[2], b[3], F + 1.05, F + 2.8, sofaMat);                           // backrest
  if (alongX) { up(x0, z0, x0 + 0.55, z1, F + 1.05, F + 2.1, sofaMat); up(x1 - 0.55, z0, x1, z1, F + 1.05, F + 2.1, sofaMat); }
  else { up(x0, z0, x1, z0 + 0.55, F + 1.05, F + 2.1, sofaMat); up(x0, z1 - 0.55, x1, z1, F + 1.05, F + 2.1, sofaMat); }
  const s0 = (alongX ? x0 : z0) + 0.6, s1 = (alongX ? x1 : z1) - 0.6;               // seat cushions between the arms
  const seats = s1 - s0 > 4.5 ? 3 : 2, w = (s1 - s0) / seats;
  for (let i = 0; i < seats; i++) {
    const c0 = s0 + i * w + 0.04, c1 = s0 + (i + 1) * w - 0.04;
    if (alongX) { const [d0, d1] = back === 'n' ? [z0 + 0.8, z1 - 0.05] : [z0 + 0.05, z1 - 0.8]; up(c0, d0, c1, d1, F + 1.05, F + 1.55, cushion); }
    else { const [d0, d1] = back === 'w' ? [x0 + 0.8, x1 - 0.05] : [x0 + 0.05, x1 - 0.8]; up(d0, c0, d1, c1, F + 1.05, F + 1.55, cushion); }
  }
  for (const [c0, c1] of [[s0 + 0.1, s0 + 1.1], [s1 - 1.1, s1 - 0.1]]) {           // accent pillows against the backrest
    if (alongX) { const [d0, d1] = back === 'n' ? [z0 + 0.8, z0 + 1.15] : [z1 - 1.15, z1 - 0.8]; up(c0, d0, c1, d1, F + 1.55, F + 2.45, accent); }
    else { const [d0, d1] = back === 'w' ? [x0 + 0.8, x0 + 1.15] : [x1 - 1.15, x1 - 0.8]; up(d0, c0, d1, c1, F + 1.55, F + 2.45, accent); }
  }
}
const rug = (x0, z0, x1, z1) => up(x0, z0, x1, z1, F + 0.04, F + 0.08, rugMat);
function table(x0, z0, x1, z1, h = 1.4) {                                           // top + 4 legs
  up(x0, z0, x1, z1, F + h - 0.12, F + h, wood);

}
function ctr(x0, z0, x1, z1) {                                                      // kitchen cabinet + granite top

}
function wc(x0, z0, x1, z1, wall) {                                                 // cistern on the n / s / e wall

  if (wall === 'n') up(x0, z0, x1, z0 + 0.6, F, F + 2.7, white);

  else up(x0, z1 - 0.6, x1, z1, F, F + 2.7, white);
}
function basin(x0, z0, x1, z1) {                                                    // basin counter + steel bowl
  up(x0, z0, x1, z1, F, F + 2.7, white);
  up(x0 + 0.25, z0 + 0.25, x1 - 0.25, z1 - 0.25, F + 2.7, F + 2.76, steel);
}
const shower = (x0, z0, x1, z1) => up(x0, z0, x1, z1, F, F + 0.12, tray);           // shower tray

// master bath: shower (NW corner), WC (north wall, faces south), basin (west wall)

wc(4.8, T, 6, T + 2.2, 'n');

up(T, 8, T + 1.25, 11.5, F, F + DOOR, oak);

// master bedroom: king bed against the east wall (head east), bedside tables, TV on the west wall

// kitchen: full L counter (north wall + whole east wall), sink on the north run, hob on the east run

// Room names: one group per floor (hidden by default), each with its own checkbox

function label(text, x, y, z, size = 1.4) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = 512; c.height = 128;
  g.font = 'bold 56px system-ui, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fffe'; g.roundRect(4, 14, 504, 100, 20); g.fill();
  g.fillStyle = '#233'; g.fillText(text, 256, 64);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(size * 4, size, 1);
  s.position.set(x, y, z);
  (y > F ? upperNames : groundNames).add(s);
  return s;
}
label('LOBBY', 12, 4, 16);

design = null;

const toggle = (id, objs) => (document.getElementById(id).onchange = e => objs.forEach(o => (o.visible = e.target.checked)));
const floorSel = document.getElementById('floor'), upOuterCb = document.getElementById('upOuter');
const syncUpper = () => {
  const v = floorSel.value, on = v !== 'hide';

};
// Room sizes (inside the walls) for the "Room sizes" section, per floor; the first floor follows the layout
const SIZES = {
  ground: [['Room 1 (back left)', `9'9" x 10'`, 98], ['Room 2 (back right)', `9'8" x 10'`, 97],
           ['Lobby', `19'11" x 9'3"`, 184], ['Road-side room', `13' x 10'11"`, 142],
           ['Washroom (under stairs)', `2'9" x 7'1"`, 20], ['Balcony over gate', `6'9" x 2'3"`, 15]],
  d1: [['Road-side room', `13'2" x 11'3"`, 148], ['Kitchen', `6'6" x 2'3"`, 15], ['Washroom (front)', `6'2" x 2'3"`, 14],
       ['Back room', `13'9" x 10'`, 138], ['Dressing', `5'8" x 4'`, 23], ['Washroom (back)', `5'8" x 5'6"`, 31]],
  d4: [['Master bedroom', `13'2" x 10'9"`, 142], ['Dressing / store', `6'3" x 3'6"`, 22], ['Master bath', `6'3" x 6'9"`, 42],
       ['Kitchen', `6'8" x 8'6"`, 57], ['Open hall (with stair top)', `12'9" x 8'6" + more`, 176],
       ['Common washroom', `6'8" x 5'6"`, 37], ['Guest room', `13'2" x 8'`, 105]],
};

  `<h4>${title}</h4><table>${rows.map(([n, d, a]) => `<tr><td>${n}</td><td>${d} · ${a} sq ft</td></tr>`).join('')}</table>`;
const renderSizes = () => {
  const v = floorSel.value;
  document.getElementById('sizes').innerHTML = sizeTable('Ground floor', SIZES.ground) +
    (v === 'hide' ? '' : sizeTable(`First floor (${v === 'd1' ? 'Design 1' : 'Design 4'})`, SIZES[v]));
};
floorSel.onchange = () => { syncUpper(); renderSizes(); };
upOuterCb.onchange = syncUpper;
syncUpper();
renderSizes();
toggle('outer', outer);
document.getElementById('groundNames').onchange = e => (groundNames.visible = e.target.checked);
document.getElementById('upperNames').onchange = e => (upperNames.visible = e.target.checked);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;

});
